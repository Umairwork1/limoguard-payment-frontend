<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e4ef;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2e3248;
      border-radius: 16px;
      padding: 48px 56px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(220, 38, 38, 0.15);
      border: 2px solid rgba(220, 38, 38, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { margin: 0 0 10px; font-size: 22px; font-weight: 700; }
    p  { margin: 0 0 28px; font-size: 14px; color: #8b90a8; line-height: 1.6; }
    .error-detail {
      font-family: monospace;
      font-size: 12px;
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 28px;
      color: #fca5a5;
      word-break: break-all;
      display: none;
    }
    a.btn {
      display: inline-block;
      background: #4f7cf6;
      color: #fff;
      text-decoration: none;
      padding: 10px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    a.btn:hover { background: #3b66e0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✕</div>
    <h1>Payment Failed</h1>
    <p>
      The payment was not completed. Your card has not been saved.
      Please go back and try again.
    </p>

    <div class="error-detail" id="error-detail"></div>

    <a href="/" class="btn">Back to App</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error') || params.get('message') || params.get('Error');
    if (err) {
      const el = document.getElementById('error-detail');
      el.textContent = err;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
